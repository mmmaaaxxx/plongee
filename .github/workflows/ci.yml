name: plouf — CI/CD Flutter

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.22.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  analyze:
    name: 🔍 Analyse statique
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Vérification du formatage
        run: dart format --output=write .

      - name: Analyse Dart (linting)
        run: flutter analyze --no-fatal-infos

  test:
    name: 🧪 Tests unitaires
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Exécution des tests unitaires
        run: flutter test --reporter=expanded

      - name: Rapport de couverture de tests
        run: flutter test --coverage

      - name: Upload couverture vers Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          flags: unittests
          name: plouf-coverage
        continue-on-error: true

  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter project
        run: flutter create --platforms=android .

      - name: Fix Kotlin version
        run: |
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/' android/build.gradle
          sed -i 's/org.jetbrains.kotlin.android\" version .*/org.jetbrains.kotlin.android" version "1.9.24" apply false/' android/settings.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          # ✅ Flutter génère toujours app-release.apk, pas plouf.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Activation de la plateforme Web
        run: flutter create --platforms=web . --project-name plouf

      - name: Build Web (CanvasKit)
        # ✅ --base-href requis pour que GitHub Pages trouve les assets
        run: flutter build web --release --web-renderer canvaskit --base-href "/${{ github.event.repository.name }}/"

      - name: Upload build web
        uses: actions/upload-artifact@v4
        with:
          # ✅ Était "plouf", corrigé en "plouf-web" pour correspondre au download-artifact
          name: plouf-web
          path: build/web/
          retention-days: 7

  build-ios:
    name: 🍎 Build iOS
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Sélection Xcode stable
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Activation de la plateforme iOS
        run: flutter create --platforms=ios . --project-name plouf

      - name: Installation des pods CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload build iOS
        uses: actions/upload-artifact@v4
        with:
          name: plouf-ios
          path: build/ios/iphoneos/
          retention-days: 7

  deploy-web:
    name: 🚀 Déploiement GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Téléchargement de l'artefact web
        uses: actions/download-artifact@v4
        with:
          # ✅ Correspond maintenant à l'upload "plouf-web"
          name: plouf-web
          path: build/web

      - name: Configuration GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: 📦 Création de release
    runs-on: ubuntu-latest
    needs: [build-android, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installation Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release --target-platform android-arm64

      - name: Activation de la plateforme Web
        run: flutter create --platforms=web . --project-name plouf

      - name: Build Web release
        # ✅ --base-href aussi pour la release
        run: flutter build web --release --web-renderer canvaskit --base-href "/${{ github.event.repository.name }}/"

      - name: Créer archive web
        run: |
          cd build/web
          zip -r ../../plouf-web.zip .

      - name: Création de la GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            plouf-web.zip
          body: |
            ## 🌊 Plouf — ${{ github.ref_name }}

            Application de révision pour les certifications FFESSM de plongée.

            ### 📱 Téléchargements
            - **Android APK** : `app-release.apk`
            - **Web** : `plouf-web.zip` (à décompresser sur un serveur)

            ### 📚 Modules disponibles
            - 🐟 Niveau 1 — PE20
            - 🐠 Niveau 2 — PA20 / PE40
            - 🦈 Niveau 3 — PA40 / PE60 / PA60
            - ⚓ Niveau 4 — Guide de Palanquée GP-N4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
